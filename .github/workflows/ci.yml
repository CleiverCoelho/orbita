name: CI

# Executa verificação de tipos, testes e cobertura a cada commit enviado
# (em qualquer branch) e em pull requests, nos três sistemas operacionais.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes e cobertura (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Não cancela os demais sistemas quando um deles falha, para que o
      # resultado de cada plataforma apareça separadamente.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # vitest 5 e jsdom 31 exigem Node ^22.22 ou ^24.15.
        node: [22, 24]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar tipos (tsc)
        run: npm run typecheck

      - name: Executar testes com cobertura
        run: npm run test:coverage

      - name: Resumo da cobertura
        if: always()
        shell: bash
        run: |
          f=coverage/coverage-summary.json
          if [ ! -f "$f" ]; then
            echo "Relatório de cobertura não foi gerado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const t = require("./" + process.argv[1]).total;
            const row = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log([
              "### Cobertura (${{ matrix.os }}, Node ${{ matrix.node }})",
              "",
              "| Métrica | % | Cobertos/Total |",
              "|---|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row),
            ].join("\n"));
          ' "$f" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-node${{ matrix.node }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
