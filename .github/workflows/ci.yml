name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Testes de unidade com cobertura
        run: npm run test:coverage

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes end-to-end
        run: npm run test:e2e

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-${{ matrix.os }}
          path: coverage/
          retention-days: 14

      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.os }}
          path: playwright-report/
          retention-days: 14
